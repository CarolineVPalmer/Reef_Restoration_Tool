# Builds the in-browser version of the tool (Shinylive: R runs inside the
# user's web browser, so uploaded data never leave their computer) and
# publishes it on GitHub Pages. Runs when the app code changes on main, or by
# hand from the Actions tab. Requires Settings > Pages > Source: GitHub Actions.
name: Publish app

on:
  push:
    branches: [main]
    paths:
      - "app.R"
      - "R/**"
      - "data/example_transects.csv"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install packages
        run: Rscript -e 'install.packages(c("shiny", "ggplot2", "ggrepel", "shinylive"))'

      - name: Build the in-browser app
        run: |
          mkdir -p app/data
          cp app.R app/ && cp -r R app/ && cp data/example_transects.csv app/data/
          Rscript -e 'shinylive::export("app", "site")'
          # GitHub Pages re-compresses the bundled R packages (.tgz) on the fly,
          # which stops webR from reading them ("Can't download Emscripten
          # filesystem image metadata"). Removing the bundle makes the app fetch
          # its packages from the official webR repository (repo.r-wasm.org)
          # instead, which serves them correctly.
          rm -rf site/shinylive/webr/packages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
