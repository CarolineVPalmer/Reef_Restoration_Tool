# Development branches only: runs the unit tests and the Reef Check example, and
# saves the output to the branch dev-test-results so it can be read without logs.
name: Dev test
on:
  push:
    branches: ["v*"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("shiny", "ggplot2", "ggrepel", "readxl", "testthat"))'
      - name: Tests and example
        run: |
          mkdir -p out
          Rscript -e 'res <- testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = FALSE); print(as.data.frame(res)[, c("file", "test", "nb", "failed", "error")])' > out/tests.txt 2>&1 || true
          Rscript -e '
            for (f in sort(list.files("R", "[.]R$", full.names = TRUE))) source(f)
            imp <- import_transect_files("data/example_reefcheck_segments.csv")
            p <- prepare_data(imp$df); p$messages <- c(imp$messages, p$messages)
            r <- run_analysis(p, list(B = 200))
            print(site_table(r)); writeLines(r$notes)' > out/reefcheck_example.txt 2>&1 || true
      - if: always()
        run: |
          cd out && git init -q -b dev-test-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "$GITHUB_SHA" > SHA.txt
          git add -A && git commit -q -m "Dev test results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" dev-test-results
